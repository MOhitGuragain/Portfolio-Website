<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake Store Products Table</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f4f4;
    padding:30px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

th, td{
    border:1px solid #ddd;
    padding:12px;
    text-align:center;
    vertical-align:middle;
}

th{
    background:#007bff;
    color:white;
    font-size:18px;
}

tr:nth-child(even){
    background:#f9f9f9;
}

tr:hover{
    background:#e8f4ff;
}

img{
    width:80px;
    height:80px;
    object-fit:contain;
}

.description{
    text-align:left;
    max-width:350px;
}

.price{
    color:green;
    font-weight:bold;
}
</style>
</head>

<body>

<h1> Fake Store Products</h1>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Image</th>
            <th>Product</th>
            <th>Price</th>
            <th>Category</th>
            <th>Description</th>
        </tr>
    </thead>

    <tbody id="productTable">

    </tbody>
</table>

<script>

const productTable = document.getElementById("productTable");

async function fetchProducts(){

    try{

        const response = await fetch("https://fakestoreapi.com/products");
        const products = await response.json();

        products.forEach(product =>{

            productTable.innerHTML += `
                <tr>
                    <td>${product.id}</td>

                    <td>
                        <img src="${product.image}" alt="${product.title}">
                    </td>

                    <td>${product.title}</td>

                    <td class="price">$${product.price}</td>

                    <td>${product.category}</td>

                    <td class="description">
                        ${product.description}
                    </td>
                </tr>
            `;

        });

    }catch(error){

        productTable.innerHTML = `
            <tr>
                <td colspan="6">Failed to load products.</td>
            </tr>
        `;

        console.error(error);
    }

}

fetchProducts();

</script>

</body>
</html>
