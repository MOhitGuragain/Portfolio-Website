<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .user-list{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    }
    .user-card{
        border:1px solid #070707;
        padding: 10px;
        margin:10px;
    }
    .heading{
        display:flex;
        justify-content:space-between;
        align-items:center;
    }
    button{
        background-color: #4CAF50;
        color: white;
        padding: 10px 10px;
        margin: 5px;
        border:none;
        border-radius:5px;
        font-size: 16px;
        cursor:pointer;
    }
    button:hover{
        background-color: #45a049;
    }
</style>
<body>
    <div class =" users">
        <div class="heading">
            <h1>User List</h1>
            <button onclick="addUser()">Add User</button>
        </div>
        <div id="userlist" class="user-list">
        </div>
    </div>
</body>
<script>
    const url = 'https://jsonplaceholder.typicode.com/users';
    const userlist = document.getElementById('userlist');

    async function fetchUsers() {
        try {
            const response = await fetch(url);
            const users = await response.json();
            console.log(users);
            users.forEach(user => {
                userlist.innerHTML += `
                <div class="user-card">
                <h2>${user.name}</h2>
                <p><strong>Email:</strong> ${user.email}</p>
                <p><strong>Phone:</strong> ${user.phone}</p>
                <p><strong>Website:</strong> ${user.website}</p>
                <div class ="btn-group">
                    <button onclick ="editUser(${user.id})">Edit User</button>
                    <button onclick ="deleteUser(${user.id})">Delete User</button>
                </div>
                </div>
                `;
        });
    }
    catch (error) {
        console.error('Error fetching users:', error);
    }
    }
async function addUser() {
    const name = prompt('Enter user name:');
    const email = prompt('Enter user email:');
    const phone = prompt('Enter user phone:');
    const user ={
        name: name,
        email: email,
        phone: phone
    }
    try{
        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(user)
        });
        if (!response.ok) {
            throw new Error('Network response was not ok');
        }
        const newUser = await response.json();
        console.log('User added successfully:', newUser);
    } catch (error) {
        console.error('Error adding user:', error);
    }
fetchUsers();
}
async function deleteUser(id) {
    try {
        const user = await fetch(`${url}/${id}`).then(response => response.json());
        console.log(user);
        const response = await fetch(`${url}/${id}`, {
            method: 'DELETE'
        });
        if (!response.ok) {
            throw new Error('Network response was not ok');
        }
        alert("User deleted with name"+ user.name + " and id "+ user.id +" successfully");
    } catch (error) {
        console.error('Error deleting user:', error);
    }
    fetchUsers();
}
async function editUser(id){
    const user = await fetch(`${url}/${id}`).then(response => response.json());
    console.log(user);
    const name = prompt('Enter new user name:', user.name);
    const email = prompt('Enter new user email:', user.email);
    const phone = prompt('Enter new user phone:', user.phone);
    const updatedUser = {
        name: name,
        email: email,
        phone: phone
    };
    try{
        const response = await fetch(`${url}/${id}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(updatedUser)
        });
        if (!response.ok) {
            throw new Error('Network response was not ok');
        }
        const updatedUserData = await response.json();
        console.log('User updated successfully:', updatedUserData);
    } catch (error) {
        console.error('Error updating user:', error);
    }
    fetchUsers();
}
    fetchUsers();
</script>

</html>
