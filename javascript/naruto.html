<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naruto Wiki</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f4f4;
    padding:30px;
}

h1{
    text-align:center;
    margin:30px 0;
    color:#333;
}

/* Characters */

.card-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
    margin-bottom:50px;
}

.card{
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 5px 12px rgba(0,0,0,.2);
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.card-content{
    padding:15px;
}

.card-content h2{
    margin-bottom:10px;
    color:#222;
}

.card-content p{
    margin:8px 0;
    color:#555;
}

/* Clans */

.clans-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.clan-card{
    background:white;
    border-radius:10px;
    padding:20px;
    box-shadow:0 5px 12px rgba(0,0,0,.15);
    text-align:center;
}

.clan-card img{
    width:120px;
    height:120px;
    object-fit:contain;
    margin-bottom:15px;
}

.clan-card h3{
    color:#333;
}
</style>

</head>

<body>

<h1>Naruto Characters</h1>

<div class="card-container"></div>

<h1>Naruto Clans</h1>

<div class="clans-container"></div>
<script>
const cardContainer = document.querySelector(".card-container");
const clansContainer = document.querySelector(".clans-container");
const beastContainer = document.querySelector(".beasts-container");

// Character Cards
async function fetchCharacters() {
    try {
        const response = await fetch("https://dattebayo-api.onrender.com/characters");
        const data = await response.json();

        const characters = data.characters || [];

        characters.forEach(character => {
            cardContainer.innerHTML += `
                <div class="card">
                    <img src="${character.images?.[0] || 'https://via.placeholder.com/300x250?text=No+Image'}"
                         alt="${character.name}">

                    <div class="card-content">
                        <h2>${character.name}</h2>

                        <p><strong>Clan:</strong>
                            ${character.personal?.clan || "None"}
                        </p>

                        <p><strong>Village:</strong>
                            ${character.personal?.affiliation || "Unknown"}
                        </p>
                    </div>
                </div>
            `;
        });

    } catch (error) {
        console.error("Characters Error:", error);
    }
}

// Clan Cards
async function fetchClans() {
    try {
        const response = await fetch("https://dattebayo-api.onrender.com/clans");
        const data = await response.json();

        const clans = data.clans || [];

        clans.forEach(clan => {
            clansContainer.innerHTML += `
                <div class="clan-card">
                    <img
                        src="${clan.images?.[0] || 'https://via.placeholder.com/150?text=Clan'}"
                        alt="${clan.name}"
                    >

                    <h3>${clan.name}</h3>

                    <p>
                        Members:
                        ${clan.characters?.length || 0}
                    </p>
                </div>
            `;
        });

    } catch (error) {
        console.error("Clans Error:", error);
    }
}

// Load Everything
async function loadData() {
    await Promise.all([
        fetchCharacters(),
        fetchClans(),
    ]);
}

loadData();
</script>

</body>
</html>
