<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Digital Clock MG</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2,
                #6a11cb,
                #2575fc
            );
            overflow: hidden;
        }

        /* Animated Background */
        body::before,
        body::after{
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
        }

        body::before{
            width: 300px;
            height: 300px;
            background: #ff6ec4;
            top: 10%;
            left: 10%;
        }

        body::after{
            width: 350px;
            height: 350px;
            background: #00f7ff;
            bottom: 10%;
            right: 10%;
        }

        .clock-container{
            width: 500px;
            padding: 40px;
            text-align: center;

            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 25px;

            box-shadow:
                0 8px 32px rgba(0,0,0,0.25),
                inset 0 1px 1px rgba(255,255,255,0.3);

            animation: float 4s ease-in-out infinite;
        }

        @keyframes float{
            0%,100%{
                transform: translateY(0);
            }
            50%{
                transform: translateY(-12px);
            }
        }

        h1{
            color: white;
            font-size: 2rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #clock{
            font-size: 4rem;
            font-weight: bold;
            color: white;
            text-shadow:
                0 0 10px rgba(255,255,255,0.8),
                0 0 20px rgba(255,255,255,0.6),
                0 0 40px rgba(255,255,255,0.4);
        }

        #date{
            margin-top: 15px;
            color: rgba(255,255,255,0.9);
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        @media(max-width: 600px){
            .clock-container{
                width: 90%;
                padding: 30px;
            }

            #clock{
                font-size: 2.5rem;
            }

            h1{
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="clock-container">
        <h1>Digital Clock</h1>
        <div id="clock">00:00:00</div>
        <div id="date">Loading...</div>
    </div>

    <script>
        function updateClock(){
            const now = new Date();

            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            const ampm = hours >= 12 ? "PM" : "AM";
            hours = hours % 12 || 12;

            hours = String(hours).padStart(2, "0");
            minutes = String(minutes).padStart(2, "0");
            seconds = String(seconds).padStart(2, "0");

            document.getElementById("clock").innerHTML =
                `${hours}:${minutes}:${seconds} <span style="font-size:1.5rem">${ampm}</span>`;

            const options = {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            };

            document.getElementById("date").textContent =
                now.toLocaleDateString("en-US", options);
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>

</body>
<footer>
    <p style="text-align:center; color:white; margin-top:20px;">
        &copy; 2026 Mohit Guragain. All rights reserved. The app is still in development phase.
    </p>
</footer>
</html>
