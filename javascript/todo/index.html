<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohit's Advanced To-Do List</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #00ff80, #00ccff);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .todo-container{
            width:450px;
            background:white;
            padding:25px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            margin-bottom:20px;
            color:#333;
        }

        .input-section{
            display:flex;
            gap:10px;
        }

        input{
            flex:1;
            padding:12px;
            font-size:16px;
            border:2px solid #ddd;
            border-radius:8px;
            outline:none;
        }

        input:focus{
            border-color:#00cc66;
        }

        .add-btn{
            padding:12px 20px;
            border:none;
            border-radius:8px;
            background:#00aa44;
            color:white;
            cursor:pointer;
            font-size:16px;
        }

        .add-btn:hover{
            background:#008833;
        }

        #taskCount{
            margin-top:15px;
            font-weight:bold;
            color:#444;
        }

        ul{
            list-style:none;
            margin-top:20px;
        }

        li{
            background:#f4f4f4;
            padding:12px;
            margin-bottom:10px;
            border-radius:8px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        li span{
            cursor:pointer;
            flex:1;
            text-align:left;
        }

        .completed{
            text-decoration:line-through;
            color:gray;
        }

        .delete-btn{
            background:red;
            color:white;
            border:none;
            padding:8px 12px;
            border-radius:5px;
            cursor:pointer;
        }

        .delete-btn:hover{
            background:darkred;
        }

        #clearBtn{
            width:100%;
            margin-top:15px;
            padding:12px;
            border:none;
            border-radius:8px;
            background:crimson;
            color:white;
            cursor:pointer;
            font-size:16px;
        }

        #clearBtn:hover{
            background:darkred;
        }
    </style>
</head>
<body>

    <div class="todo-container">

        <h1>📝 To-Do List</h1>

        <div class="input-section">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >
            <button class="add-btn">Add</button>
        </div>

        <p id="taskCount">Total Tasks: 0</p>

        <ul id="taskList"></ul>

        <button id="clearBtn">Clear All Tasks</button>

    </div>

    <script>

        const taskInput = document.getElementById("taskInput");
        const addBtn = document.querySelector(".add-btn");
        const taskList = document.getElementById("taskList");
        const clearBtn = document.getElementById("clearBtn");
        const taskCount = document.getElementById("taskCount");

        // Update Counter
        function updateTaskCount(){
            taskCount.textContent =
                `Total Tasks: ${taskList.children.length}`;
        }

        // Save Tasks
        function saveTasks(){

            const tasks = [];

            document.querySelectorAll("#taskList li").forEach(li => {

                tasks.push({
                    text: li.querySelector("span").textContent,
                    completed: li.querySelector("span")
                                .classList.contains("completed")
                });

            });

            localStorage.setItem(
                "tasks",
                JSON.stringify(tasks)
            );
        }

        // Create Task
        function createTask(taskText, completed = false){

            const li = document.createElement("li");

            const span = document.createElement("span");
            span.textContent = taskText;

            if(completed){
                span.classList.add("completed");
            }

            span.addEventListener("click", function(){

                span.classList.toggle("completed");

                saveTasks();
            });

            const deleteBtn =
                document.createElement("button");

            deleteBtn.textContent = "Delete";

            deleteBtn.classList.add("delete-btn");

            deleteBtn.addEventListener("click", function(){

                li.remove();

                saveTasks();
                updateTaskCount();
            });

            li.appendChild(span);
            li.appendChild(deleteBtn);

            taskList.appendChild(li);

            saveTasks();
            updateTaskCount();
        }

        // Add Task
        addBtn.addEventListener("click", function(){

            const taskText =
                taskInput.value.trim();

            if(taskText === ""){

                alert("Please enter a task!");

                return;
            }

            createTask(taskText);

            taskInput.value = "";
        });

        // Enter Key Support
        taskInput.addEventListener("keypress", function(e){

            if(e.key === "Enter"){

                addBtn.click();
            }
        });

        // Clear All
        clearBtn.addEventListener("click", function(){

            if(confirm("Delete all tasks?")){

                taskList.innerHTML = "";

                saveTasks();
                updateTaskCount();
            }
        });

        // Load Saved Tasks
        window.addEventListener("load", function(){

            const savedTasks =
                JSON.parse(localStorage.getItem("tasks"))
                || [];

            savedTasks.forEach(task => {

                createTask(
                    task.text,
                    task.completed
                );
            });

            updateTaskCount();
        });

    </script>

</body>
<footer>
    <p style="text-align:center; color:white; margin-top:20px;">
        &copy; 2026 Mohit Guragain. All rights reserved. The app is still in development phase.
    </p>
</html>
