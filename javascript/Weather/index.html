<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<title>Mohit's Weather App</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
}

.card{
    width:420px;
    padding:30px;
    border-radius:20px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(15px);
    color:white;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.card h1{
    text-align:center;
    margin-bottom:25px;
}

.search{
    display:flex;
    gap:10px;
    margin-bottom:30px;
}

.search input{
    flex:1;
    padding:12px;
    border:none;
    outline:none;
    border-radius:12px;
    font-size:16px;
}

.search button{
    border:none;
    background:#ffffff;
    color:#333;
    padding:12px 18px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    transition:.3s;
}

.search button:hover{
    background:#222;
    color:white;
}

.weather-content{
    text-align:center;
}

.weather-content img{
    width:130px;
}

.city{
    font-size:30px;
    font-weight:bold;
}

.temp{
    font-size:60px;
    font-weight:bold;
}

.condition{
    font-size:22px;
    margin:8px 0;
    text-transform:capitalize;
}

.details{
    margin-top:25px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.box{
    background:rgba(255,255,255,.2);
    padding:15px;
    border-radius:15px;
}

.box h3{
    font-size:15px;
    margin-bottom:8px;
}

.box p{
    font-size:20px;
    font-weight:bold;
}

.error{
    text-align:center;
    color:#ffdddd;
    font-size:18px;
}

@media(max-width:500px){

.card{
    width:95%;
}

.details{
    grid-template-columns:1fr;
}

.temp{
    font-size:50px;
}

}
.weather-content{
    animation:fade .7s ease;
}

@keyframes fade{

from{
    opacity:0;
    transform:translateY(30px);
}

to{
    opacity:1;
    transform:translateY(0);
}

}
.box i{

    font-size:30px;
    color:#ffd54f;
    margin-bottom:10px;

}
#history{

display:flex;
justify-content:center;
gap:10px;
margin-top:20px;
flex-wrap:wrap;

}

.history-btn{

padding:8px 15px;
border:none;
border-radius:20px;
cursor:pointer;

}
</style>
</head>

<body>

    <!-- Greeting -->
    <h2 id="greeting"></h2>

    <!-- Live Clock -->
    <div id="clock"></div>

    <div class="card">

        <h1>🌤 Weather App</h1>

        <div class="search">
            <input type="text" id="input" placeholder="Enter city">
            <button id="search">Search</button>
        </div>

        
        <div id="history"></div>

       
        <div id="loading"></div>

        
        <div id="weather"></div>

    </div>

<script>

const inputType=document.getElementById("input");
const searchBtn=document.getElementById("search");
const weather=document.getElementById("weather");

const apiKey="4aa113fe50e61df11b9793a6760dc7b2";
const historyDiv=document.getElementById("history");

let history=
JSON.parse(localStorage.getItem("history"))||[];

searchBtn.addEventListener("click",getWeather);

inputType.addEventListener("keydown",(e)=>{
    if(e.key==="Enter"){
        getWeather();
    }
});

function changeBackground(weather,icon){

if(icon.includes("n")){

document.body.style.background=
"linear-gradient(135deg,#141E30,#243B55)";
return;

}

switch(weather.toLowerCase()){

case "clear":

document.body.style.background=
"linear-gradient(135deg,#f6d365,#fda085)";
break;

case "clouds":

document.body.style.background=
"linear-gradient(135deg,#bdc3c7,#2c3e50)";
break;

case "rain":
case "drizzle":

document.body.style.background=
"linear-gradient(135deg,#4b79a1,#283e51)";
break;

case "snow":

document.body.style.background=
"linear-gradient(135deg,#E6DADA,#274046)";
break;

default:

document.body.style.background=
"linear-gradient(135deg,#4facfe,#00f2fe)";

}

}

async function getWeather(){

    const city=inputType.value.trim();
    localStorage.setItem("city",city);

    if(!history.includes(city)){

history.unshift(city);

if(history.length>5){

history.pop();

}

localStorage.setItem(
"history",
JSON.stringify(history)
);

displayHistory();

}

    if(city===""){
        weather.innerHTML="<p class='error'>Please enter a city.</p>";
        return;
    }

    try{

        const response=await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`);

        if(!response.ok){
            throw new Error("City not found");
        }

        const data=await response.json();
        changeBackground(
data.weather[0].main,
data.weather[0].icon
);

        weather.innerHTML=`<div class="weather-content">

<h2>${data.name}, ${data.sys.country}</h2>

 <img src="https://openweathermap.org/img/wn/${data.weather[0].icon}@4x.png">
 <div class="condition">${data.weather[0].description}</div>


<div class="details">

<div class="box">
<i class="fa-solid fa-temperature-half"></i>
<h3>Feels Like</h3>
<p>${Math.round(data.main.feels_like)}°C</p>
</div>

<div class="box">
<i class="fa-solid fa-droplet"></i>
<h3>Humidity</h3>
<p>${data.main.humidity}%</p>
</div>

<div class="box">
<i class="fa-solid fa-wind"></i>
<h3>Wind</h3>
<p>${data.wind.speed} m/s</p>
</div>

<div class="box">
<i class="fa-solid fa-gauge-high"></i>
<h3>Pressure</h3>
<p>${data.main.pressure} hPa</p>
</div>

</div>

</div>
        `;

    }
    catch(error){
        weather.innerHTML="<p class='error'>City not found!</p>";
    }

}
function displayHistory(){

historyDiv.innerHTML="";

history.forEach(city=>{

const btn=document.createElement("button");

btn.className="history-btn";

btn.textContent=city;

btn.onclick=()=>{

inputType.value=city;

getWeather();

};

historyDiv.appendChild(btn);

});

}

window.onload=()=>{

const lastCity=
localStorage.getItem("city");

if(lastCity){

inputType.value=lastCity;

getWeather();

}

displayHistory();

}
</script>

</body>
</html>
